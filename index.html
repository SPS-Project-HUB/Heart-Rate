<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX30100 Health Monitor</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Keep all your existing CSS styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .vital-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .vital-value {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .heart-rate .vital-value {
            color: #e74c3c;
        }

        .oxygen .vital-value {
            color: #3498db;
        }

        .vital-label {
            font-size: 1.2rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .finger-status {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .finger-present {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .finger-absent {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .no-data {
            color: #6c757d;
            font-style: italic;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
        }

        .connected {
            background-color: #2ecc71;
            color: white;
        }

        .disconnected {
            background-color: #e74c3c;
            color: white;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❤️ MAX30100 Health Monitor</h1>
            <p>Real-time Heart Rate & Blood Oxygen Monitoring</p>
        </div>

        <div class="connection-status" id="connectionStatus">
            🔴 Disconnected
        </div>

        <div class="dashboard">
            <!-- Finger Status Card -->
            <div class="card" id="fingerStatusCard">
                <div class="vital-icon" id="fingerIcon">👆</div>
                <div class="vital-value" id="fingerStatus">Check Sensor</div>
                <div class="vital-label">Finger Status</div>
                <div id="fingerMessage" class="finger-status finger-absent">
                    Please place your finger on the sensor
                </div>
            </div>

            <div class="card vital-card heart-rate">
                <div class="vital-icon">💓</div>
                <div class="vital-value" id="heartRate">--</div>
                <div class="vital-label">Heart Rate <span class="vital-unit">BPM</span></div>
            </div>

            <div class="card vital-card oxygen">
                <div class="vital-icon">🌬️</div>
                <div class="vital-value" id="oxygenLevel">--</div>
                <div class="vital-label">Blood Oxygen <span class="vital-unit">%</span></div>
            </div>
        </div>

        <div class="card">
            <h3>📊 Status Overview</h3>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 20px;">
                <div style="text-align: center;">
                    <div class="status-value" id="sensorStatus">Checking...</div>
                    <div class="status-label">Sensor Status</div>
                </div>
                <div style="text-align: center;">
                    <div class="status-value" id="consecutiveReadings">0</div>
                    <div class="status-label">Valid Readings</div>
                </div>
                <div style="text-align: center;">
                    <div class="status-value" id="lastUpdate">Never</div>
                    <div class="status-label">Last Update</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://heart-rate-a2749-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const heartRateElement = document.getElementById('heartRate');
        const oxygenLevelElement = document.getElementById('oxygenLevel');
        const connectionStatusElement = document.getElementById('connectionStatus');
        const sensorStatusElement = document.getElementById('sensorStatus');
        const consecutiveReadingsElement = document.getElementById('consecutiveReadings');
        const lastUpdateElement = document.getElementById('lastUpdate');
        const fingerStatusElement = document.getElementById('fingerStatus');
        const fingerMessageElement = document.getElementById('fingerMessage');
        const fingerIconElement = document.getElementById('fingerIcon');
        const fingerStatusCard = document.querySelector('#fingerStatusCard');

        // Listen for new readings
        const readingsRef = database.ref('readings');
        
        readingsRef.orderByChild('ms').limitToLast(1).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const readingId = Object.keys(data)[0];
                const reading = data[readingId];
                
                updateDashboard(reading);
                updateConnectionStatus(true);
            }
        }, (error) => {
            console.error('Firebase error:', error);
            updateConnectionStatus(false);
        });

        function updateDashboard(reading) {
            // Update finger detection status
            updateFingerStatus(reading);

            // Update heart rate
            if (reading.finger_detected && reading.hr > 0) {
                heartRateElement.textContent = Math.round(reading.hr);
                heartRateElement.classList.remove('no-data');
            } else {
                heartRateElement.textContent = '--';
                heartRateElement.classList.add('no-data');
            }

            // Update oxygen level
            if (reading.finger_detected && reading.spo2 > 0) {
                oxygenLevelElement.textContent = reading.spo2.toFixed(1);
                oxygenLevelElement.classList.remove('no-data');
            } else {
                oxygenLevelElement.textContent = '--';
                oxygenLevelElement.classList.add('no-data');
            }

            // Update sensor status
            sensorStatusElement.textContent = reading.sensor_available ? 
                '🟢 Connected' : '🔴 Disconnected';

            // Update consecutive readings
            consecutiveReadingsElement.textContent = reading.consecutive_readings || 0;

            // Update last update time
            lastUpdateElement.textContent = new Date().toLocaleTimeString();
        }

        function updateFingerStatus(reading) {
            if (reading.finger_detected) {
                fingerStatusElement.textContent = 'Detected ✓';
                fingerMessageElement.textContent = 'Finger properly placed - reading data';
                fingerMessageElement.className = 'finger-status finger-present';
                fingerIconElement.textContent = '👍';
                fingerStatusCard.style.background = 'rgba(212, 237, 218, 0.3)';
            } else {
                fingerStatusElement.textContent = 'Not Detected ✗';
                fingerMessageElement.textContent = 'Please place finger on sensor for accurate readings';
                fingerMessageElement.className = 'finger-status finger-absent';
                fingerIconElement.textContent = '👆';
                fingerStatusCard.style.background = 'rgba(248, 215, 218, 0.3)';
            }
        }

        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatusElement.textContent = '🟢 Connected to Firebase';
                connectionStatusElement.className = 'connection-status connected';
            } else {
                connectionStatusElement.textContent = '🔴 Disconnected from Firebase';
                connectionStatusElement.className = 'connection-status disconnected';
            }
        }

        // Initial connection check
        setTimeout(() => {
            if (!firebase.apps.length) {
                updateConnectionStatus(false);
                sensorStatusElement.textContent = '🔴 No Data Received';
            }
        }, 5000);
    </script>
</body>
</html>
